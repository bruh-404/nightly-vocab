services:
  db:
    image: postgres:16-alpine
    container_name: lexicontext_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexicontext}
      POSTGRES_USER: ${POSTGRES_USER:-lexi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexi} -d ${POSTGRES_DB:-lexicontext}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexicontext_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexicontext_scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while true; do python manage.py send_reminders; sleep 60; done"]
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: lexicontext_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Domain required for Caddy}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
