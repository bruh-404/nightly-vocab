{% extends "base.html" %}

{% block title %}ورود به حساب کاربری | Nightly Vocab{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 50px auto 0;">
  <div class="card" style="padding: 32px 24px;">
    <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 8px; text-align: center;">
      ورود به حساب کاربری
    </h1>
    <p class="text-muted" style="font-size: 13px; margin-bottom: 24px; text-align: center;">
      ثبت‌نام اولیه در سامانه تنها با حساب گوگل امکان‌پذیر است.
    </p>

    <!-- Google Login Button -->
    <a href="/accounts/google/login/" class="btn btn-primary" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; font-size: 15px; font-weight: 700; margin-bottom: 24px; box-sizing: border-box;">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M21.35 11.1h-9.17v2.98h5.27c-.23 1.22-.92 2.25-1.95 2.94v2.44h3.16c1.85-1.7 2.91-4.21 2.91-7.26 0-.74-.07-1.45-.22-2.1z"/><path fill="#fff" d="M12.18 21c2.65 0 4.88-.88 6.51-2.38l-3.16-2.44c-.88.59-2 .94-3.35.94-2.57 0-4.75-1.74-5.53-4.07h-3.26v2.52C5.01 18.77 8.34 21 12.18 21z"/><path fill="#fff" d="M6.65 13.05c-.2-.59-.31-1.22-.31-1.87s.11-1.28.31-1.87V6.79H3.39C2.7 8.16 2.31 9.71 2.31 11.37s.39 3.21 1.08 4.58l3.26-2.9z"/><path fill="#fff" d="M12.18 5.76c1.44 0 2.73.5 3.75 1.48l2.81-2.81C17.05 2.87 14.82 2 12.18 2 8.34 2 5.01 4.23 3.39 7.42l3.26 2.52c.78-2.33 2.96-4.18 5.53-4.18z"/></svg>
      ورود با حساب گوگل
    </a>

    <div style="display: flex; align-items: center; margin-bottom: 24px; gap: 12px;">
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
      <span class="text-muted" style="font-size: 12px;">یا ورود با رمز عبور</span>
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
    </div>

    <!-- Password Login Form -->
    <form method="post" action="{% url 'accounts:password_login' %}">
      {% csrf_token %}
      <div style="margin-bottom: 16px;">
        <label class="form-label" style="font-size: 13px;">ایمیل یا نام کاربری</label>
        <input type="text" name="email" required placeholder="name@example.com" class="form-input" style="direction: ltr;">
      </div>
      <div style="margin-bottom: 20px;">
        <label class="form-label" style="font-size: 13px;">رمز عبور</label>
        <input type="password" name="password" required placeholder="••••••••" class="form-input" style="direction: ltr;">
      </div>
      <button type="submit" class="btn" style="width: 100%; padding: 10px; font-size: 14px; font-weight: 600;">
        ورود به حساب
      </button>
    </form>
  </div>
</div>
{% endblock %}
